- name: Update Debian 13 hosts
  hosts: os_debian
  order: sorted
  become: true
  force_handlers: true
  tasks:
    - name: Update repositories and run a dist-upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_checksum: no
      register: reboot_required_file

    - name: Reboot if allowed and required
      ansible.builtin.reboot:
      when: "(proxmox_tags_parsed is defined and 'auto-reboot' in proxmox_tags_parsed and reboot_required_file.stat.exists is true) or (auto_reboot is defined and auto_reboot is true and reboot_required_file.stat.exists is true)"

    - name: Run autoremove
      ansible.builtin.apt:
        autoremove: true
